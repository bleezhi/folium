# Folium Paint for Android

The first Android shell for Folium Paint, built with Kotlin and Jetpack Compose.

## Current preview

- Native Compose application shell.
- Basic touch/stylus drawing canvas.
- Pressure-aware line width using Android pointer pressure.
- Color selection and clear-canvas action.

This is a UI prototype, not yet connected to the Rust engine. It does not yet save projects, support layers, or export images.

## Build

Open this directory in Android Studio, or from this directory run:

```sh
gradle assembleDebug
```

Requirements: JDK 17 and Android SDK platform 35.
